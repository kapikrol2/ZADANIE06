<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{% block tytul %}System Biblioteczny{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <nav>
            <a href="{{ url_for('index') }}">Start</a> |
            <a href="{{ url_for('lista') }}">Lista</a> |
            <a href="{{ url_for('dodaj') }}">Dodaj</a>
        </nav>
        <!-- Zadanie 6: Formularz wyszukiwania w bazowym szablonie -->
        <form method="get" action="{{ url_for('szukaj') }}" class="search-form">
            <input type="text" name="q" placeholder="Szukaj książki lub autora..." value="{{ request.args.get('q', '') }}">
            <button type="submit">Szukaj</button>
        </form>
    </header>
    <hr>
    <main>
        {% block tresc %}{% endblock %}
    </main>
    <hr>
    <footer>
        <p>&copy; 4TP 2026 | Autor: Bartosz Bryniarski / Projekt Flask</p>
    </footer>
</body>
</html>
